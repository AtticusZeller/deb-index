name: Update APT Repository
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils jq gnupg

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.gnupg
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Update Repository
        run: |
          set -euo pipefail
          rm -rf pool dists version-lock site
          mkdir -p pool dists version-lock
          for config in configs/*.json; do
            bash scripts/build-repo.sh "$config"
          done
          bash scripts/build-repo.sh --generate-metadata
          gpg --batch --yes --dearmor -o "$RUNNER_TEMP/deb-index-keyring.gpg" public.key
          gpgv --keyring "$RUNNER_TEMP/deb-index-keyring.gpg" dists/stable/InRelease

      - name: Prepare APT site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r pool dists site/
          cp public.key install.sh uninstall.sh site/
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>DEB Index</title><h1>DEB Index</h1><p>APT packages: sing-box (SFL), alacritty. GUI packages are available for amd64.</p><p><a href="install.sh">Repository installer</a> | <a href="public.key">GPG public key</a></p></html>' > site/index.html
          size=$(du -sb site | cut -f1)
          # Leave room below the GitHub Pages 1 GB published-site limit.
          if (( size > 950000000 )); then
            echo "APT site is too large for Pages: $size bytes" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
